name: Coleta diária Clipping LETS

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3, sem horário de verão): 08h, 11h,
    # 13h e 17h BRT viram 11h, 14h, 16h e 20h UTC. Todos os dias, inclusive
    # sábado e domingo.
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}  # permite rodar na mão pela aba Actions do GitHub

permissions:
  contents: write  # precisa pra poder commitar data/noticias.json de volta

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coletor
        run: python -m coletor.fetch --dias 90

      - name: Publicar dados atualizados (aciona o redeploy automático no Vercel)
        run: |
          git config user.name "Clipping LETS bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index.html
          git diff --staged --quiet || git commit -m "Coleta automática $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
