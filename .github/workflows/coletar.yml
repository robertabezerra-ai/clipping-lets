name: Coleta diária Clipping LETS

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3, sem horário de verão): 08h, 12h,
    # 15h e 17h BRT viram 11h, 15h, 18h e 20h UTC. Só em dias úteis.
    - cron: "0 11 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch: {}  # permite rodar na mão pela aba Actions do GitHub

permissions:
  contents: write  # precisa pra poder commitar data/noticias.json de volta

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar config.local.yml (SMTP do alerta da Receita Federal)
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          RFB_DESTINATARIOS: ${{ secrets.RFB_DESTINATARIOS }}
        run: |
          python3 - <<'PYEOF'
          import os
          import yaml

          destinatarios = [e.strip() for e in os.environ.get("RFB_DESTINATARIOS", "").split(",") if e.strip()]
          cfg = {
              "smtp": {
                  "host": "smtp.office365.com",
                  "porta": 587,
                  "usuario": os.environ["SMTP_USUARIO"],
                  "senha": os.environ["SMTP_SENHA"],
                  "remetente": os.environ["SMTP_USUARIO"],
              },
              "alerta_rfb": {"destinatarios": destinatarios},
          }
          with open("config.local.yml", "w", encoding="utf-8") as f:
              yaml.safe_dump(cfg, f, allow_unicode=True)
          PYEOF

      - name: Rodar coletor (já dispara o alerta da Receita Federal se houver novidade)
        run: python -m coletor.fetch --dias 90

      - name: Publicar dados atualizados (aciona o redeploy automático no Vercel)
        run: |
          git config user.name "Clipping LETS bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index.html
          git diff --staged --quiet || git commit -m "Coleta automática $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
