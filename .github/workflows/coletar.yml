name: Coleta diária Clipping LETS

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3, sem horário de verão): 08h, 12h,
    # 15h e 17h BRT viram 11h, 15h, 18h e 20h UTC. Só em dias úteis.
    - cron: "0 11 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch: {}  # permite rodar na mão pela aba Actions do GitHub

permissions:
  contents: write  # precisa pra poder commitar data/noticias.json de volta

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coletor
        # Sem config.local.yml, o coletor pula sozinho o e-mail automático da
        # Receita Federal e segue normal — o banner vermelho na página
        # continua avisando de qualquer forma. Se um dia vocês quiserem
        # ligar o e-mail automático, é só recriar o passo que gera
        # config.local.yml com os segredos SMTP_USUARIO/SMTP_SENHA/
        # RFB_DESTINATARIOS cadastrados no repositório.
        run: python -m coletor.fetch --dias 90

      - name: Publicar dados atualizados (aciona o redeploy automático no Vercel)
        run: |
          git config user.name "Clipping LETS bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index.html
          git diff --staged --quiet || git commit -m "Coleta automática $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
