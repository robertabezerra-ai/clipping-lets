# Dicionários de score de relevância do Clipping LETS (0-100).
#
# O score APENAS ordena e sinaliza — nunca exclui nada. A decisão final é
# sempre humana, na página de curadoria. Ajuste os pesos aqui; não precisa
# mexer em coletor/relevancia.py.
#
# Cuidado: o casamento é por pedaço de palavra (substring, sem acento),
# então plural às vezes precisa de entrada própria — veja
# "medida provisoria" e "medidas provisorias" abaixo.

base: 40
alta_relevancia: 50   # score >= isso ganha o selo "Alta relevância"

